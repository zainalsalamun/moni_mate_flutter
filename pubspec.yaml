
name: monimate
description: MoniMate – Offline Expense Tracker (Flutter template)
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  path_provider: ^2.1.2
  csv: ^6.0.0
  share_plus: ^10.0.2
  get_storage: ^2.1.1
  lottie: ^2.3.1
  # google_mlkit_text_recognition: ^0.12.0
  camera: ^0.11.0
  table_calendar: ^3.0.9
  google_mlkit_text_recognition: ^0.15.1
  image_picker: ^1.2.1
  flutter_local_notifications: ^20.1.0
  confetti: ^0.8.0
  vibration: ^3.1.8
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  flutter_svg: ^2.2.4
  cached_network_image: ^3.4.1
  # Sync dependencies
  googleapis: ^13.2.0
  google_sign_in: ^6.2.2
  http: ^1.2.1
  connectivity_plus: ^6.1.4
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  pdf: ^3.12.0
  screenshot: ^3.0.0
  timezone: ^0.10.1
  flutter_timezone: ^5.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.6
  hive_generator: ^2.0.1
  flutter_native_splash: ^2.2.12

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/monimate_logo.png
    - assets/images/banks/
    - .env


flutter_native_splash:
  color: "#48C6EF"                # background color native splash (ocean toska)
  image: assets/images/monimate_logo.png  
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  web: false
