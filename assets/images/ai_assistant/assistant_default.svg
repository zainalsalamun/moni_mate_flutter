<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="50%" stop-color="#03A9F4"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0288D1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#soft-shadow)">
    <!-- Base Button -->
    <circle cx="256" cy="256" r="200" fill="url(#bg-grad)"/>
    
    <!-- Sparkles -->
    <path d="M380 150 Q390 150 390 140 Q390 150 400 150 Q390 150 390 160 Q390 150 380 150 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M120 350 Q125 350 125 345 Q125 350 130 350 Q125 350 125 355 Q125 350 120 350 Z" fill="#FFFFFF" opacity="0.6"/>

    <!-- Neck -->
    <path d="M216 320 L296 320 L316 380 Q256 410 196 380 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- Ears -->
    <rect x="136" y="226" width="30" height="60" rx="15" fill="#FFFFFF" opacity="0.8"/>
    <rect x="346" y="226" width="30" height="60" rx="15" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Antenna -->
    <line x1="256" y1="120" x2="256" y2="170" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <circle cx="256" cy="110" r="16" fill="#FFFFFF"/>
    <circle cx="256" cy="110" r="8" fill="#4FC3F7"/>

    <!-- Head -->
    <rect x="156" y="166" width="200" height="160" rx="65" fill="#FFFFFF"/>
    
    <!-- Screen -->
    <rect x="176" y="196" width="160" height="100" rx="40" fill="url(#screen-grad)"/>
    
    <!-- Glare -->
    <path d="M186 216 Q256 196 326 216 Q326 226 316 236 Q256 216 196 236 Q186 226 186 216 Z" fill="#FFFFFF" opacity="0.1"/>

    <!-- Eyes Removed for Flutter Animation -->
    
    <!-- Smile -->
    <path d="M244 266 Q256 278 268 266" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
  </g>
</svg>
