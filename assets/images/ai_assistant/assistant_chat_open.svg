<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="50%" stop-color="#03A9F4"/>
      <stop offset="100%" stop-color="#0288D1"/>
    </linearGradient>
    <linearGradient id="screen-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0288D1"/>
      <stop offset="100%" stop-color="#01579B"/>
    </linearGradient>
    <filter id="strong-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="light-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Huge back glow -->
  <circle cx="256" cy="256" r="180" fill="#4FC3F7" filter="url(#strong-glow)" opacity="0.8"/>

  <!-- Base -->
  <circle cx="256" cy="256" r="200" fill="url(#bg-grad)"/>
  
  <!-- Additional Floating Sparkles -->
  <g filter="url(#light-glow)">
    <path d="M380 150 Q390 150 390 140 Q390 150 400 150 Q390 150 390 160 Q390 150 380 150 Z" fill="#FFFFFF"/>
    <path d="M120 350 Q125 350 125 345 Q125 350 130 350 Q125 350 125 355 Q125 350 120 350 Z" fill="#FFFFFF"/>
    
    <path d="M410 280 Q420 280 420 270 Q420 280 430 280 Q420 280 420 290 Q420 280 410 280 Z" fill="#FFFFFF"/>
    <path d="M100 180 Q110 180 110 170 Q110 180 120 180 Q110 180 110 190 Q110 180 100 180 Z" fill="#FFFFFF"/>
    <path d="M280 90 Q285 90 285 85 Q285 90 290 90 Q285 90 285 95 Q285 90 280 90 Z" fill="#FFFFFF"/>
  </g>

  <g>
    <!-- Neck -->
    <path d="M216 320 L296 320 L316 380 Q256 410 196 380 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- Ears -->
    <rect x="136" y="226" width="30" height="60" rx="15" fill="#FFFFFF" opacity="0.8"/>
    <rect x="346" y="226" width="30" height="60" rx="15" fill="#FFFFFF" opacity="0.8"/>
    
    <!-- Antenna glowing -->
    <line x1="256" y1="120" x2="256" y2="170" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
    <circle cx="256" cy="110" r="18" fill="#FFFFFF" filter="url(#light-glow)"/>
    <circle cx="256" cy="110" r="10" fill="#4FC3F7"/>

    <!-- Head -->
    <rect x="156" y="166" width="200" height="160" rx="65" fill="#FFFFFF"/>
    
    <!-- Screen -->
    <rect x="176" y="196" width="160" height="100" rx="40" fill="url(#screen-grad)"/>
    
    <!-- Glare -->
    <path d="M186 216 Q256 196 326 216 Q326 226 316 236 Q256 216 196 236 Q186 226 186 216 Z" fill="#FFFFFF" opacity="0.1"/>

    <!-- Happy Eyes -->
    <path d="M 212 248 Q 226 232 240 248" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 272 248 Q 286 232 300 248" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" fill="none"/>
    
    <!-- Big Smile -->
    <path d="M240 266 Q256 284 272 266" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" fill="none"/>
    
    <!-- Blush -->
    <ellipse cx="206" cy="260" rx="12" ry="8" fill="#FF5252" opacity="0.6" filter="url(#light-glow)"/>
    <ellipse cx="306" cy="260" rx="12" ry="8" fill="#FF5252" opacity="0.6" filter="url(#light-glow)"/>
  </g>
</svg>
